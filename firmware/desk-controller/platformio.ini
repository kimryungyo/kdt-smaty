; 높이 relay와 틸트를 한 대가 맡는 통합 펌웨어다. 보드는 ESP32-WROOM-32E
; (클래식 ESP32)로, C3와 달리 native USB가 없어 UART0로 업로드하고 진단한다.
[env:esp32dev]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  knolleary/PubSubClient @ 2.8
  bblanchon/ArduinoJson @ 7.4.2

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -std=c++17
lib_deps = bblanchon/ArduinoJson @ 7.4.2
