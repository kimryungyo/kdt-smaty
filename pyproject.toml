[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-desk-fin"
version = "0.1.0"
description = "SMART DESK 단일 프로세스 비동기 애플리케이션"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiomqtt>=2.5.1,<3",
    "fastapi>=0.139,<1",
    "numpy>=2.1,<3",
    "opencv-python-headless>=4.11,<5",
    "pydantic-settings>=2.10,<3",
    "pyserial>=3.5,<4",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
voice = [
    "openai>=2.53,<3",
    "sounddevice>=0.5.5,<0.6",
    "pyopen-wakeword>=1.1,<2",
]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "mqtt_integration: 로컬 MQTT broker가 필요한 통합 테스트",
    "openai_voice_integration: OpenAI API key와 network가 필요한 음성 통합 테스트",
    "voice_hardware: 실제 microphone과 speaker가 필요한 음성 통합 테스트",
]
