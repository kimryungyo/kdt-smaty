name: smart-desk

services:
  emqx:
    image: emqx/emqx:6.2.2
    hostname: emqx
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - /etc/smart-desk/emqx.env
    environment:
      EMQX_NODE__NAME: emqx@emqx
      EMQX_LOG__CONSOLE__ENABLE: "true"
    volumes:
      - emqx_data:/opt/emqx/data
      - ./emqx/base.hocon:/opt/emqx/etc/base.hocon:ro
    ports:
      - "1883:1883"
      - "127.0.0.1:18083:18083"
    healthcheck:
      # HTTP status avoids coupling container health to the Erlang CLI node-name
      # resolver while still checking that the dashboard process is serving.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18083/api/v5/status >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s
    networks: [fin-internal]

  mediamtx:
    image: bluenviron/mediamtx:1.19.2
    restart: unless-stopped
    stop_grace_period: 15s
    volumes:
      - ./mediamtx/mediamtx.runtime.yml:/mediamtx.yml:ro
    ports:
      - "8889:8889/tcp"
      - "8189:8189/udp"
    networks: [fin-internal]

  # Relay JPEG frames produced by the UVC camera without decoding or H.264
  # re-encoding them on the Raspberry Pi.
  mjpeg-user-cam:
    image: mkuf/ustreamer:v6.52-2-g3bb1ed3
    user: "0:0"
    restart: unless-stopped
    command:
      - --device=/dev/user-cam
      - --format=MJPEG
      - --resolution=1920x1080
      - --desired-fps=2
      - --encoder=HW
      - --workers=1
      - --host=0.0.0.0
      - --port=8080
    devices:
      - "${SMART_DESK_MEDIA__USER__DEVICE}:/dev/user-cam"
    ports:
      - "10001:8080"
    networks: [fin-internal]

  main:
    build:
      context: ..
      target: main-runtime
    image: smart-desk-fin-main:local
    restart: unless-stopped
    stop_grace_period: 30s
    user: "1000:1001"
    env_file:
      - ../.env
    environment:
      SMART_DESK_ENVIRONMENT: production
      SMART_DESK_MQTT__HOST: emqx
      SMART_DESK_MQTT__PORT: "1883"
      SMART_DESK_SERIAL__PORT: /dev/desk-height
      # relay와 tilt는 GPIO 직결이 기본이다. ESP32 구성으로 되돌릴 때만 .env에서
      # mqtt로 덮어쓰고, 그때는 아래 devices에 보드 serial 경로를 다시 넣는다.
      SMART_DESK_DESK__RELAY_TRANSPORT: ${SMART_DESK_DESK__RELAY_TRANSPORT:-gpio}
      SMART_DESK_TILT__TRANSPORT: ${SMART_DESK_TILT__TRANSPORT:-gpio}
      SMART_DESK_DASHBOARD__FRONTEND_DIRECTORY: /app/frontend/dist
      SMART_DESK_PROFILE_MEMORY__DATA_PATH: /app/data/mem0
      SMART_DESK_PROFILE_MEMORY__HISTORY_DB_PATH: /app/data/mem0/history.db
      MEM0_DIR: /app/data/mem0/runtime
      MEM0_TELEMETRY: "false"
      SMART_DESK_VISION_CLIENT__ENABLED: "true"
      SMART_DESK_VISION_CLIENT__BASE_URL: ${SMART_DESK_VISION_CLIENT__BASE_URL:-http://kimryungyo-main:50001}
      SMART_DESK_MEDIA__USER__PUBLISH_ENABLED: "false"
      SMART_DESK_MEDIA__USER__RECEIVE_ENABLED: "false"
      SMART_DESK_MEDIA__USER__DEVICE: /dev/user-cam
      SMART_DESK_MEDIA__WORKSPACE__PUBLISH_ENABLED: "false"
      SMART_DESK_MEDIA__WORKSPACE__RECEIVE_ENABLED: "false"
      SMART_DESK_MEDIA__WORKSPACE__DEVICE: /dev/workspace-cam
      SMART_DESK_MEDIA__POSTURE__RECEIVE_ENABLED: "false"
      # Host PipeWire aliases are not visible in the container; use the
      # directly-mounted ALSA speaker name discovered on this appliance.
      SMART_DESK_VOICE__OUTPUT_DEVICE_NAME: "HD-Audio Generic: ALC897 Analog (hw:2,0)"
      SMART_DESK_AUTOMATION__EXECUTE_AUTOMATIC_MOVEMENTS: "true"
    volumes:
      - ../data:/app/data
      # 틸트 20kHz는 lgpio 소프트웨어 PWM 상한(10kHz)을 넘어 하드웨어 PWM이
      # 필요하다. sysfs 노드를 그대로 열어 준다.
      - /sys/class/pwm:/sys/class/pwm
      - /sys/devices/platform:/sys/devices/platform
    devices:
      - "${SMART_DESK_SERIAL__PORT}:/dev/desk-height"
      # relay와 tilt는 ESP32 대신 라즈베리파이 GPIO로 직접 구동한다. Pi 5의
      # 40핀 헤더는 gpiochip0(pinctrl-rp1)이다.
      - "/dev/gpiochip0:/dev/gpiochip0"
      - "/dev/snd:/dev/snd"
    group_add:
      - "20"
      - "29"
      - "1001"
      # gpio 그룹. gpiochip 노드가 root:gpio 0660이라 없으면 열 수 없다.
      - "${SMART_DESK_GPIO_GID:-986}"
    ports:
      - "9090:9090"
      - "10000:10000"
    depends_on:
      emqx:
        condition: service_healthy
    networks: [fin-internal]

  vision:
    profiles: [local-vision]
    build:
      context: ..
      target: vision-runtime
    image: smart-desk-fin-vision:local
    restart: unless-stopped
    stop_grace_period: 30s
    user: "1000:1001"
    env_file:
      - ../.env
    environment:
      SMART_DESK_ENVIRONMENT: production
      SMART_DESK_VISION_SERVER__HOST: 0.0.0.0
      SMART_DESK_VISION_SERVER__PORT: "9091"
      SMART_DESK_MEDIA__USER__PUBLISH_ENABLED: "false"
      SMART_DESK_MEDIA__USER__RECEIVE_ENABLED: "true"
      SMART_DESK_MEDIA__USER__RECEIVE_URL: http://mjpeg-user-cam:8080/stream
      SMART_DESK_MEDIA__WORKSPACE__PUBLISH_ENABLED: "false"
      SMART_DESK_MEDIA__WORKSPACE__RECEIVE_ENABLED: "false"
      SMART_DESK_MEDIA__POSTURE__PUBLISH_ENABLED: "false"
      SMART_DESK_MEDIA__POSTURE__RECEIVE_ENABLED: "false"
      SMART_DESK_FACE__DETECTOR_MODEL_PATH: /app/assets/vision/models/face_detection_yunet_2023mar.onnx
      SMART_DESK_FACE__EMBEDDING_MODEL_PATH: /app/assets/vision/models/face_recognition_sface_2021dec.onnx
      SMART_DESK_VISION__LOWER_POSE_MODEL_PATH: /app/assets/vision/models/yolo26n-pose.onnx
      # Current camera calibration: the detected face has blur variance ~26.
      SMART_DESK_FACE__MIN_BLUR_VARIANCE: "20"
    ports:
      - "127.0.0.1:9091:9091"
    depends_on:
      mjpeg-user-cam:
        condition: service_started
    networks: [fin-internal]

networks:
  fin-internal:
    driver: bridge

volumes:
  emqx_data:
